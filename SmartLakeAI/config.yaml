camera:
  default_source: 0
  fps_limit: 30
database:
  sqlite_path: backend/database/smartlake.db
model:
  conf_threshold: 0.25
  custom_weights: models/best.pt
  device: auto
  img_size: 640
  iou_threshold: 0.45
  pretrained_weights: yolov8n-seg.pt
  task: segment
pollution_thresholds:
  critical:
  - 31
  - 999999
  high:
  - 16
  - 30
  low:
  - 0
  - 5
  moderate:
  - 6
  - 15
project:
  name: SmartLake AI
  subtitle: Intelligent Lake Waste Detection, Classification and Pollution Monitoring
    System
  version: 1.0.0
reports:
  output_dir: reports/
training:
  batch_size: 16
  epochs: 5
  learning_rate: 0.01
  patience: 10
  save_period: 5
